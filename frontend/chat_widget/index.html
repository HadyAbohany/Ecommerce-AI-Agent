<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Store Assistant</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f4f5f7;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
      margin: 0;
    }
    #chat-container {
      width: 100%;
      max-width: 480px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      height: 640px;
      overflow: hidden;
    }
    #chat-header {
      background: #1a1a2e;
      color: #fff;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #chat-header h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
    }
    #reset-btn {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.4);
      color: #fff;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }
    #reset-btn:hover { background: rgba(255,255,255,0.1); }

    #messages {
      flex: 1;
      overflow-y: auto;
      scroll-behavior: smooth;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg-wrap {
      display: flex;
      flex-direction: column;
      max-width: 80%;
      animation: msg-in 0.2s ease-out;
    }
    .msg-wrap.user { align-self: flex-end; align-items: flex-end; }
    .msg-wrap.agent, .msg-wrap.error, .msg-wrap.loading { align-self: flex-start; align-items: flex-start; }

    @keyframes msg-in {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg {
      padding: 10px 14px;
      border-radius: 14px;
      line-height: 1.4;
      font-size: 14px;
      white-space: pre-wrap;
    }
    .msg p { margin: 0 0 6px 0; }
    .msg p:last-child { margin-bottom: 0; }
    .msg ul, .msg ol { margin: 4px 0; padding-left: 20px; }
    .msg.user {
      background: #1a1a2e;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg.agent {
      background: #eef0f3;
      color: #1a1a2e;
      border-bottom-left-radius: 4px;
    }
    .msg.error {
      background: #fdecea;
      color: #a33a2c;
    }
    .msg.loading {
      background: #eef0f3;
      color: #888;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 12px 16px;
    }
    .msg-time {
      font-size: 11px;
      color: #9a9aa5;
      margin-top: 3px;
      padding: 0 4px;
    }

    .typing-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #9a9aa5;
      animation: typing-bounce 1.2s infinite ease-in-out;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.15s; }
    .typing-dot:nth-child(3) { animation-delay: 0.3s; }
    @keyframes typing-bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.6; }
      30% { transform: translateY(-4px); opacity: 1; }
    }

    #input-row {
      display: flex;
      border-top: 1px solid #eee;
      padding: 12px;
      gap: 8px;
    }
    #message-input {
      flex: 1;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 14px;
      outline: none;
    }
    #message-input:focus { border-color: #1a1a2e; }
    #send-btn {
      background: #1a1a2e;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 14px;
      cursor: pointer;
    }
    #send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div id="chat-container">
    <div id="chat-header">
      <h2>Store Assistant</h2>
      <button id="reset-btn">Reset</button>
    </div>
    <div id="messages"></div>
    <div id="input-row">
      <input id="message-input" type="text" placeholder="Ask about products, orders, shipping..." autocomplete="off">
      <button id="send-btn">Send</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="chat.js"></script>
</body>
</html>
