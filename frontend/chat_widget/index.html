<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Store Assistant</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f4f5f7;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
      margin: 0;
    }
    #chat-container {
      width: 100%;
      max-width: 480px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      height: 640px;
      overflow: hidden;
    }
    #chat-header {
      background: #1a1a2e;
      color: #fff;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #chat-header h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
    }
    #reset-btn {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.4);
      color: #fff;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }
    #reset-btn:hover { background: rgba(255,255,255,0.1); }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 14px;
      line-height: 1.4;
      font-size: 14px;
      white-space: pre-wrap;
    }
    .msg.user {
      align-self: flex-end;
      background: #1a1a2e;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg.agent {
      align-self: flex-start;
      background: #eef0f3;
      color: #1a1a2e;
      border-bottom-left-radius: 4px;
    }
    .msg.error {
      align-self: flex-start;
      background: #fdecea;
      color: #a33a2c;
    }
    .msg.loading {
      align-self: flex-start;
      background: #eef0f3;
      color: #888;
      font-style: italic;
    }

    #input-row {
      display: flex;
      border-top: 1px solid #eee;
      padding: 12px;
      gap: 8px;
    }
    #message-input {
      flex: 1;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 14px;
      outline: none;
    }
    #message-input:focus { border-color: #1a1a2e; }
    #send-btn {
      background: #1a1a2e;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 14px;
      cursor: pointer;
    }
    #send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div id="chat-container">
    <div id="chat-header">
      <h2>Store Assistant</h2>
      <button id="reset-btn">Reset</button>
    </div>
    <div id="messages"></div>
    <div id="input-row">
      <input id="message-input" type="text" placeholder="Ask about products, orders, shipping..." autocomplete="off">
      <button id="send-btn">Send</button>
    </div>
  </div>

  <script src="chat.js"></script>
</body>
</html>
